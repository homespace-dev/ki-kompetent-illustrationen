<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Die drei Wirkungsebenen der KI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="illu-base.css" />
<style>
  /* nur Datei-spezifisches */
  /* Chip rechts neben dem Untertitel, damit der lange Titel einzeilig bleibt */

  /* Drei Bänder (Verlauf erlaubt) – in S/W lesbar über weiße Ziffer, weißes Label und Name 20/800 */
  .stack{width:488px;display:flex;flex-direction:column;gap:12px;}
  .band{position:relative;height:76px;border-radius:12px;display:flex;align-items:center;gap:14px;padding:0 20px;color:#fff;overflow:hidden;}
  .band .lbl{color:#fff;letter-spacing:.12em;}
  .band .n{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;margin-top:2px;color:#fff;}
  .band .no{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:40px;font-weight:900;line-height:1;color:#fff;letter-spacing:-0.04em;}
  .e1{background:linear-gradient(110deg,#6E97D6,#41639E);}
  .e2{background:linear-gradient(110deg,#8076C8,#574799);}
  .e3{background:linear-gradient(110deg,#CB7C95,#9C4E69);}
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Als PNG herunterladen
    </button>
  </div>

  <div class="wrap">
    <div class="card" id="capture">
      <div class="hd">
        <h1 class="title">Die drei Wirkungsebenen der KI</h1>
        <p class="subtitle">Von operativer Effizienz über persönliche Produktivität hin zur strategischen Transformation.</p>
      </div>

      <div class="stack">
        <div class="band e1 a1">
          <span class="ico lg"><svg viewBox="0 0 24 24"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg></span>
          <div><div class="lbl">Operativ</div><div class="n">Effizienz</div></div>
          <div class="no">01</div>
        </div>
        <div class="band e2 a2">
          <span class="ico lg"><svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>
          <div><div class="lbl">Persönlich</div><div class="n">Produktivität</div></div>
          <div class="no">02</div>
        </div>
        <div class="band e3 a5">
          <span class="ico lg"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span>
          <div><div class="lbl">Strategisch</div><div class="n">Transformation</div></div>
          <div class="no">03</div>
        </div>
      </div>
    </div>
  </div>

<script src="illu-export.js"></script>
</body>
</html>
