<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenAI, ChatGPT &amp; GPT-3.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="illu-base.css" />
<style>
  /* nur Datei-spezifisches */

  /* Drei verschachtelte Ebenen: weiße Panels, nach innen kräftigerer Rahmen + kleinerer Innenabstand (S/W-Stufung) */
  .nest{width:488px;}
  .lvl{padding:14px;background:var(--acc-soft);}
  .lvl.l2{margin-top:14px;padding:12px;border:1.5px solid var(--accent);background:var(--acc-soft);}
  .lvl.l3{margin-top:12px;padding:11px;border:1.5px solid var(--accent);background:var(--acc-soft);}
  .lhead{display:flex;align-items:center;gap:12px;}
  .lhead .txt{flex:1;min-width:0;}
  .lname{font-size:16px;font-weight:800;letter-spacing:-0.015em;line-height:1.2;color:var(--ink);}
  .lhead .small{margin-top:2px;}
  .lhead .chip{margin-left:auto;}
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Als PNG herunterladen
    </button>
  </div>

  <div class="wrap">
    <div class="card" id="capture">
      <div class="hd">
          <h1 class="title">OpenAI, ChatGPT &amp; GPT-3.5</h1>
          <p class="subtitle">Drei Ebenen: das Unternehmen, sein Produkt – und das Modell dahinter.</p>
      </div>

      <div class="nest">
        <div class="panel lvl l1 a1">
          <div class="lhead">
            <span class="ico lg"><svg viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/></svg></span>
            <div class="txt"><div class="lname">OpenAI</div><div class="small">Die Firma dahinter</div></div>
            <span class="chip acc">Unternehmen</span>
          </div>

          <div class="panel lvl l2 a2">
            <div class="lhead">
              <span class="ico lg"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
              <div class="txt"><div class="lname">ChatGPT</div><div class="small">Chat-Oberfläche &amp; das Modell dahinter</div></div>
              <span class="chip acc">Produkt</span>
            </div>

            <div class="panel lvl l3 a5">
              <div class="lhead">
                <span class="ico lg"><svg viewBox="0 0 24 24"><path d="M9.94 14.06A2 2 0 0 0 8.5 12.62L2.37 11.04a.5.5 0 0 1 0-.96L8.5 8.5a2 2 0 0 0 1.44-1.44l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13A2 2 0 0 0 15.5 8.5l6.13 1.58a.5.5 0 0 1 0 .96L15.5 12.62a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg></span>
                <div class="txt"><div class="lname">GPT-3.5</div><div class="small">Ein KI-Sprachmodell (Large Language Model)</div></div>
                <span class="chip acc">Modell</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="illu-export.js"></script>
</body>
</html>
